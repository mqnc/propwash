<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="media/favicon.ico">
    <title>PropWash</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.182.0/examples/jsm/"
      }
    }
    </script>
</head>

<body style="margin:0; overflow:hidden; background-color: #123456;">

    <div id="battery" style="
        height:33.333vh;
        width:calc(33.333vh * 0.3);
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        border:4px solid white;
        border-radius:20px;
        box-sizing:border-box;
        padding:10px;
        display:flex;
        flex-direction:column;
        justify-content:flex-end;
        pointer-events: none;
    ">
        <div id="progress" style="
            height:0%;
            width:100%;
            background:lime;
            border-radius:4px;
            position:relative;
            overflow:hidden;
        "></div>
        <span id="clickLabel" style="
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%) rotate(-90deg);
            white-space:nowrap;
            font-size:5vh;
            font-family:monospace;
            font-weight:bold;
            color:#123456;
        ">Click!</span>
    </div>

    <script type="module">
        import JSON5 from 'https://unpkg.com/json5@2/dist/index.min.mjs'
        //import RAPIER from 'https://cdn.skypack.dev/@dimforge/rapier3d-compat';
        import RAPIER from 'https://cdn.skypack.dev/pin/@dimforge/rapier3d-compat@v0.19.3-Hmo5REaX4aU99UROofMk/mode=imports,min/optimized/@dimforge/rapier3d-compat.js'
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { controlInputs } from './controls.js'
        import Stats from 'three/addons/libs/stats.module.js';

        const dt = 1.0 / 100.0; // physics timestep

        const params = new URLSearchParams(window.location.search);
        const debug = params.get('debug') === 'true';

        window.THREE = THREE;
        const pi = Math.PI
        const deg = pi / 180
        const inch = 0.0254
        THREE.Euler.prototype.setFromRPYdeg = function (rpy) {
            const [r, p, y] = rpy;
            // note that 'ZYX' is only the order of application, the order of arguments is still x y z
            this.set(r * deg, p * deg, y * deg, 'ZYX');
            return this;
        }
        function rpyDegToQuat(rpy) {
            return new THREE.Quaternion().setFromEuler((new THREE.Euler()).setFromRPYdeg(rpy));
        }

        async function main() {

            // load layered config
            async function loadConfig(path) {
                return JSON5.parse(await (await fetch(path)).text())
            }

            function deepMerge(target, source) {
                for (const key in source) {
                    if (
                        source[key] &&
                        typeof source[key] === "object" &&
                        !Array.isArray(source[key])
                    ) {
                        if (!target[key]) target[key] = {}
                        deepMerge(target[key], source[key])
                    } else {
                        target[key] = source[key]
                    }
                }
                return target
            }

            async function resolveConfig(entryPath) {
                const entry = await loadConfig(entryPath)

                let result = {}

                if (entry.extends) {
                    for (const path of entry.extends) {
                        const parent = await resolveConfig(path)
                        result = deepMerge(result, parent)
                    }
                }

                return deepMerge(result, entry)
            }

            let config = {}
            let userConfig = params.get('config') ?? ''

            for (const path of ["configs/default.json5", ...userConfig.split(",")]) {
                if (path === '') { continue }
                const resolved = await resolveConfig(path)
                config = deepMerge(config, resolved)
            }

            console.assert(config.version == 1.0)
            console.assert(config.aircraft.type == "quadcopter")

            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            const canvas = renderer.domElement;
            document.body.appendChild(canvas);

            // Loaders
            const hdrLoader = new HDRLoader();
            const gltfLoader = new GLTFLoader();
            const audioLoader = new THREE.AudioLoader();

            function waitForClick(target = canvas) {
                return new Promise(resolve => {
                    target.addEventListener('click', () => {
                        canvas.requestPointerLock()
                        document.getElementById('clickLabel').style.display = 'none'
                        resolve();
                    }, { once: true });
                });
            }

            // Load Resources
            let progressList = {}
            let loaderCounter = 0
            function progressCallbackFactory() {
                const loaderId = loaderCounter++
                return (e) => {
                    progressList[loaderId] = [e.loaded, e.total]
                    if (Object.keys(progressList).length === loaderCounter) {
                        let loaded = 0, total = 0
                        for (const progress of Object.values(progressList)) {
                            // loaded can be bigger than total... :/
                            loaded += Math.min(progress[0], progress[1])
                            total += progress[1]
                        }
                        document.getElementById('progress').style.height = `${100 * loaded / total}%`
                    }
                }
            }

            let [
                rapier,
                droneModel,
                propWav,
                terrainModel,
                bgMap,
                envMap,
                musicWav,
                clicked
            ] = await Promise.all([
                /* rapier = */ RAPIER.init(),
                /* droneModel = */ gltfLoader.loadAsync(config.aircraft.model.path, progressCallbackFactory()),
                /* propWav = */ audioLoader.loadAsync(config.aircraft.propSound.path, progressCallbackFactory()),
                /* terrainModel = */ gltfLoader.loadAsync(config.map.model.path, progressCallbackFactory()),
                /* bgMap = */ hdrLoader.loadAsync(config.background.backgroundMap.path, progressCallbackFactory()),
                /* envMap = */ hdrLoader.loadAsync(config.background.environmentMap.path, progressCallbackFactory()),
                /* musicWav = */ audioLoader.loadAsync(config.background.music.path, progressCallbackFactory()),
                /* clicked = */ waitForClick()
            ])

            document.getElementById('battery').style.display = 'none'

            canvas.addEventListener("click", e => {
                if (e.button !== 0) return;

                if (document.pointerLockElement === null) {
                    canvas.requestPointerLock();
                } else {
                    document.exitPointerLock();
                }
            });

            // Stats
            let engineStats = new Stats()
            engineStats.showPanel(0)
            engineStats.dom.style.cssText = 'position:absolute;top:10px;left:100px;';
            document.body.appendChild(engineStats.dom)

            let graphicsStats = new Stats()
            graphicsStats.showPanel(0)
            graphicsStats.dom.style.cssText = 'position:absolute;top:10px;left:10px;';
            document.body.appendChild(graphicsStats.dom)


            // Scene
            const scene = new THREE.Scene();
            window.scene = scene
            scene.background = new THREE.Color(0x87ceeb);
            if (debug) { scene.add(new THREE.AxesHelper(1)); }
            THREE.Object3D.DEFAULT_UP = new THREE.Vector3(
                -config.map.gravity[0],
                -config.map.gravity[1],
                -config.map.gravity[2]
            )
            const g = THREE.Object3D.DEFAULT_UP.length()
            THREE.Object3D.DEFAULT_UP.normalize()

            // Lighting
            envMap.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = envMap;
            scene.environmentRotation.setFromRPYdeg(config.background.environmentMap.rollPitchYaw);
            bgMap.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = bgMap;
            scene.backgroundRotation.setFromRPYdeg(config.background.backgroundMap.rollPitchYaw);

            // Rapier World
            const world = new RAPIER.World({
                x: config.map.gravity[0],
                y: config.map.gravity[1],
                z: config.map.gravity[2]
            });
            world.timestep = dt * config.map.timeScale
            // const groundBody = world.createRigidBody(new RAPIER.RigidBodyDesc(RAPIER.RigidBodyType.Fixed).setTranslation(0, -1, 0));
            // world.createCollider(RAPIER.ColliderDesc.cuboid(50, 0.1, 50), groundBody);

            // Drone
            const droneSize = config.aircraft.boundingBox.size;
            let ixx, iyy, izz;
            function createDroneBody() {
                // extra function to limit auxiliary variable scope
                const [w, h, d] = config.aircraft.boundingBox.size;
                const m = config.aircraft.mass;
                // we just use bounding box for inertia; tilt rates are controlled anyway
                ixx = 1 / 12 * m * (h * h + d * d);
                iyy = 1 / 12 * m * (w * w + d * d);
                izz = 1 / 12 * m * (w * w + h * h);
                return world.createRigidBody(
                    new RAPIER.RigidBodyDesc(RAPIER.RigidBodyType.Dynamic)
                        .setTranslation(...config.map.spawn.position)
                        .setRotation(rpyDegToQuat(config.map.spawn.rollPitchYaw))
                        .setAdditionalMassProperties(
                            config.aircraft.mass,
                            { x: 0.0, y: 0.0, z: 0.0 },
                            { x: ixx, y: iyy, z: izz, },
                            { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
                        )
                );
            }
            const droneBody = createDroneBody();
            droneBody.setLinearDamping(0.0);
            droneBody.setAngularDamping(0.0);

            let droneDesc = RAPIER.ColliderDesc
                .cuboid(droneSize[0] / 2, droneSize[1] / 2, droneSize[2] / 2)
                .setTranslation(...config.aircraft.boundingBox.position)
                .setDensity(0);

            const droneCollider = world.createCollider(droneDesc, droneBody);

            let droneNode = new THREE.Object3D()
            scene.add(droneNode)

            let droneMesh = droneModel.scene
            droneMesh.scale.set(...config.aircraft.model.scale)
            droneMesh.position.set(...config.aircraft.model.position)
            droneMesh.quaternion.copy(rpyDegToQuat(config.aircraft.model.rollPitchYaw))
            droneNode.add(droneMesh);
            droneNode.add(new THREE.AxesHelper(0.1));

            if (debug) {
                const droneBox = new THREE.Mesh(
                    new THREE.BoxGeometry(...droneSize),
                    new THREE.MeshStandardMaterial({ color: 0xff0000, transparent: true, opacity: 0.5 })
                );
                droneBox.position.set(...config.aircraft.boundingBox.position)
                droneNode.add(droneBox);
            }

            const droneMixer = new THREE.AnimationMixer(droneMesh);
            droneModel.animations.forEach((clip) => { droneMixer.clipAction(clip).play(); });

            // Camera
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera)

            // orbit controls do not work with a parent object, so we need to create a global dummy camera and copy its pose to the drone camera
            const camDummy = new THREE.PerspectiveCamera();
            scene.add(camDummy);
            camDummy.position.set(-1, 0, 0.4)
            camDummy.lookAt(0, 0, 0)
            const orbit = new OrbitControls(camDummy, renderer.domElement);
            orbit.update()
            orbit.screenSpacePanning = true;
            orbit.minDistance = 0.3;
            orbit.maxDistance = 3;
            orbit.mouseButtons = {
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.ROTATE
            }
            // target pose for camera which it will follow with some PT1 smoothing
            const camTarget = new THREE.Object3D()
            droneNode.add(camTarget)

            // Debug
            const debugGeometry = new THREE.BufferGeometry();
            const debugMaterial = new THREE.LineBasicMaterial({ vertexColors: true });
            const debugLines = new THREE.LineSegments(debugGeometry, debugMaterial);
            debugLines.renderOrder = 999;
            scene.add(debugLines);

            // Terrain
            let terrain = terrainModel.scene
            scene.add(terrain);
            terrain.position.set(...config.map.model.position)
            terrain.quaternion.copy(rpyDegToQuat(config.map.model.rollPitchYaw))
            terrain.scale.set(...config.map.model.scale)

            terrain.updateWorldMatrix(true, true);
            terrain.traverse((child) => {
                // extract geometry for physics

                if (!child.isMesh) return;

                const geom = child.geometry;
                const posAttr = geom.attributes.position;
                const indexAttr = geom.index;

                const worldMatrix = child.matrixWorld;
                const v = new THREE.Vector3();

                const worldPositions = new Float32Array(posAttr.count * 3);

                for (let i = 0; i < posAttr.count; i++) {
                    v.fromBufferAttribute(posAttr, i);
                    v.applyMatrix4(worldMatrix);

                    worldPositions[i * 3 + 0] = v.x;
                    worldPositions[i * 3 + 1] = v.y;
                    worldPositions[i * 3 + 2] = v.z;
                }

                const indices = indexAttr ? indexAttr.array : undefined;

                const trimeshDesc = RAPIER.ColliderDesc.trimesh(worldPositions, indices);
                world.createCollider(trimeshDesc);
            });

            // Sound
            const listener = new THREE.AudioListener();
            camera.add(listener);
            const propSounds = []
            const maxThrustFrequency = config.aircraft.propSound.maxThrustRPM / 60.0 * config.aircraft.propSound.numBlades
            const tiltDeltaFrequency = config.aircraft.propSound.tiltDeltaRPM / 60.0 * config.aircraft.propSound.numBlades
            const oscillateFrequency = config.aircraft.propSound.oscillateRPM / 60.0 * config.aircraft.propSound.numBlades
            for (let i = 0; i < 4; i++) {
                const sound = new THREE.PositionalAudio(listener);
                sound.setBuffer(propWav);
                sound.setLoop(true);
                // work around for this: https://discourse.threejs.org/t/start-audio-with-correct-volume-instead-of-quickly-ramping-down-from-100/89793
                sound.gain.gain.value = 0.00;
                setTimeout(() => sound.setVolume(config.aircraft.propSound.volume), 50);
                sound.play();
                droneNode.add(sound);
                propSounds.push(sound)
            }
            function setFrequency(iMotor, frequency) {
                const factor = frequency / config.aircraft.propSound.recordingFrequency;
                const octaves = Math.log2(factor);
                const cents = octaves * 1200
                propSounds[iMotor].setDetune(cents)
            }
            const music = new THREE.Audio(listener);
            music.setBuffer(musicWav);
            music.setLoop(true);
            music.setVolume(config.background.music.volume);
            music.play();

            // Controls

            let trace = [] // for backtracking when stuck
            let nextCheckpoint = Math.ceil(0.5 / dt)

            const maxSingleMotorThrust = config.aircraft.maxCombinedThrust / 4
            const lever = config.aircraft.wheelbase * 0.5 * Math.SQRT1_2 // from center of mass to motor along x or y
            const maxPitchRollTorque = 4 * lever * maxSingleMotorThrust
            const maxMotorDrag = 0.07 * maxSingleMotorThrust * (config.aircraft.propSize * inch) // according to ChatGPT
            const maxYawTorque = 2 * (config.aircraft.wheelbase / 2) * maxSingleMotorThrust
            const hoverThrottle = g * config.aircraft.mass / config.aircraft.maxCombinedThrust

            function handleControls() {
                nextCheckpoint--
                if (nextCheckpoint <= 0) {
                    nextCheckpoint = Math.ceil(0.5 / dt)
                    trace.push([droneBody.translation(), droneBody.rotation()])
                    if (trace.length > 60) { trace.shift() }
                }

                const { throttleInput, yawInput, pitchInput, rollInput, reset } = controlInputs(dt)

                if (reset) {
                    droneBody.resetForces(true);
                    droneBody.resetTorques(true);
                    droneBody.setLinvel({ x: 0, y: 0, z: 0 });
                    droneBody.setAngvel({ x: 0, y: 0, z: 0 });
                    if (trace.length >= 2) {
                        const [t, r] = trace[trace.length - 2]
                        droneBody.setTranslation(t);
                        droneBody.setRotation(r);
                        trace.pop()
                        trace.pop()
                    }
                    else {
                        droneBody.setTranslation(
                            { x: config.map.spawn.position[0], y: config.map.spawn.position[1], z: config.map.spawn.position[2] }
                        );
                        droneBody.setRotation(rpyDegToQuat(config.map.spawn.rollPitchYaw))
                    }
                    return
                }

                // make it so that the drone hovers when the stick is in the middle
                let throttle;
                if (throttleInput <= 0.5) {
                    throttle = throttleInput * 2 * hoverThrottle
                }
                else {
                    throttle = hoverThrottle + (throttleInput * 2 - 1) * (1 - hoverThrottle)
                }

                let t = performance.now() / 1000
                let frequencies = [
                    maxThrustFrequency * Math.sqrt(throttle) + oscillateFrequency * Math.sin(t + 4)
                    + (+ pitchInput + yawInput + rollInput) * tiltDeltaFrequency,
                    maxThrustFrequency * Math.sqrt(throttle) + oscillateFrequency * Math.sin(t * 0.91245142 + 5)
                    + (+ pitchInput - yawInput - rollInput) * tiltDeltaFrequency,
                    maxThrustFrequency * Math.sqrt(throttle) + oscillateFrequency * Math.sin(t * 0.85234134 + 7)
                    + (- pitchInput + yawInput - rollInput) * tiltDeltaFrequency,
                    maxThrustFrequency * Math.sqrt(throttle) + oscillateFrequency * Math.sin(t * 0.73514635 + 20)
                    + (- pitchInput - yawInput + rollInput) * tiltDeltaFrequency
                ]

                for (let i = 0; i < 4; i++) {
                    frequencies[i] = Math.max(100, frequencies[i])
                    setFrequency(i, frequencies[i])
                }

                const rotation = droneBody.rotation();
                const q = new THREE.Quaternion(rotation.x, rotation.y, rotation.z, rotation.w);
                const qInv = q.clone().invert();

                const linvel = droneBody.linvel();
                const angvel = droneBody.angvel();
                const localLinearVelocity = new THREE.Vector3(linvel.x, linvel.y, linvel.z).applyQuaternion(qInv);
                const localAngularVelocity = new THREE.Vector3(angvel.x, angvel.y, angvel.z).applyQuaternion(qInv);

                const localTargetAngularVelocity = new THREE.Vector3(
                    rollInput * config.aircraft.maxRollRate * deg,
                    pitchInput * config.aircraft.maxPitchRate * deg,
                    yawInput * config.aircraft.maxYawRate * deg,
                );

                const localForce = new RAPIER.Vector3(0, 0, -throttle * config.aircraft.maxCombinedThrust);
                const localTorque = new RAPIER.Vector3(
                    (localTargetAngularVelocity.x - localAngularVelocity.x) * ixx / config.aircraft.rollTimeConstant,
                    (localTargetAngularVelocity.y - localAngularVelocity.y) * iyy / config.aircraft.pitchTimeConstant,
                    (localTargetAngularVelocity.z - localAngularVelocity.z) * izz / config.aircraft.yawTimeConstant,
                );

                if (Math.abs(localTorque.x) > maxPitchRollTorque) { localTorque.x = maxPitchRollTorque * Math.sign(localTorque.x) }
                if (Math.abs(localTorque.y) > maxPitchRollTorque) { localTorque.y = maxPitchRollTorque * Math.sign(localTorque.y) }
                if (Math.abs(localTorque.z) > maxYawTorque) { localTorque.z = maxYawTorque * Math.sign(localTorque.z) }

                const thrustForce = new THREE.Vector3(localForce.x, localForce.y, localForce.z).applyQuaternion(q);
                const thrustTorque = new THREE.Vector3(localTorque.x, localTorque.y, localTorque.z).applyQuaternion(q);

                const [vx, vy, vz] = localLinearVelocity.toArray();
                const [wx, wy, wz] = localAngularVelocity.toArray();
                const d = config.aircraft.dragForceOverSpeed
                const d2 = config.aircraft.dragForceOverSpeedSquared
                const dragForce = new THREE.Vector3(
                    -d[0] * vx - d2[0] * vx * Math.abs(vx),
                    -d[1] * vy - d2[1] * vy * Math.abs(vy),
                    -d[2] * vz - d2[2] * vz * Math.abs(vz),
                ).applyQuaternion(q);

                droneBody.resetForces(true);
                droneBody.resetTorques(true);

                droneBody.addForce(new RAPIER.Vector3(thrustForce.x, thrustForce.y, thrustForce.z), true);
                droneBody.addTorque(new RAPIER.Vector3(thrustTorque.x, thrustTorque.y, thrustTorque.z), true);
                droneBody.addForce(new RAPIER.Vector3(dragForce.x, dragForce.y, dragForce.z), true);

            }

            function updateDebugRender() {
                const { vertices, colors } = world.debugRender();

                const positions = new Float32Array(vertices);
                const colorArray = new Float32Array(colors);

                debugGeometry.setAttribute(
                    'position',
                    new THREE.BufferAttribute(positions, 3)
                );

                debugGeometry.setAttribute(
                    'color',
                    new THREE.BufferAttribute(colorArray, 4)
                );

                debugGeometry.computeBoundingSphere();
            }

            const raycaster = new THREE.Raycaster();

            function updateCamera() {
                const fraction = 0.5
                let viewDir = camDummy.position.clone()
                droneNode.localToWorld(viewDir)
                viewDir.sub(droneNode.position)
                let far = viewDir.length()
                viewDir.normalize()
                raycaster.set(droneNode.position, viewDir)
                raycaster.far = far / fraction
                const intersects = raycaster.intersectObject(terrain, true)
                if (intersects.length > 0) {
                    const intersect = intersects[0]
                    camTarget.position.copy(intersect.point)
                    droneNode.worldToLocal(camTarget.position)
                    camTarget.position.multiplyScalar(fraction)
                }
                else {
                    camTarget.position.copy(camDummy.position);
                }
                camTarget.quaternion.copy(camDummy.quaternion);

                camera.position.lerp(camTarget.getWorldPosition(new THREE.Vector3()), 0.45)
                camera.quaternion.slerp(camTarget.getWorldQuaternion(new THREE.Quaternion()), 0.3)
            }

            // run engine
            world.step()
            let tNextStep = performance.now()
            function stepPhysics() {

                handleControls();

                world.step()

                // update drone mesh
                const pos = droneBody.translation();
                const rot = droneBody.rotation();
                droneNode.position.set(pos.x, pos.y, pos.z);
                droneNode.quaternion.set(rot.x, rot.y, rot.z, rot.w);

                updateCamera();
                engineStats.update()
                const tNow = performance.now()
                tNextStep = tNextStep + dt * 1000
                tNextStep = Math.max(tNextStep, tNow - 100) // if we lag by more than 0.1s, we slow down
                setTimeout(stepPhysics, Math.max(0, tNextStep - tNow))
            }
            setTimeout(stepPhysics, dt * 1000)

            // run graphics
            function animate() {
                requestAnimationFrame(animate);
                if (debug) { updateDebugRender() }
                droneMixer.setTime(Math.random() * 1000)
                renderer.render(scene, camera);
                graphicsStats.update()
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        main()

    </script>
</body>

</html>
