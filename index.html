<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="media/favicon.ico">
    <title>PropWash</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.182.0/examples/jsm/"
      }
    }
    </script>
</head>

<body style="margin:0; overflow:hidden; background-color: #123456;">

    <div id="battery" style="
        height:33.333vh;
        width:calc(33.333vh * 0.3);
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        border:4px solid white;
        border-radius:20px;
        box-sizing:border-box;
        padding:10px;
        display:flex;
        flex-direction:column;
        justify-content:flex-end;
        pointer-events: none;
    ">
        <div id="progress" style="
            height:0%;
            width:100%;
            background:lime;
            border-radius:4px;
            position:relative;
            overflow:hidden;
        "></div>
        <span id="clickLabel" style="
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%) rotate(-90deg);
            white-space:nowrap;
            font-size:5vh;
            font-family:monospace;
            font-weight:bold;
            color:#123456;
        ">Click!</span>
    </div>

    <script type="module">

        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        import { debug, initDebugRender, updateDebugRender } from './src/debug.js'
        import { pi, deg, inch, setFromRPYdeg, rpyDegToQuat } from './src/utils.js'
        import { readInputs } from './src/inputs.js'
        import { loadConfig } from './src/config.js'
        import { THREE, RAPIER, loadResources } from './src/resources.js'
        import { createStats } from './src/ui.js'
        import { createTerrain } from './src/terrain.js'
        import { createDrone } from './src/drone.js'
        import { initSound, updateSound } from './src/sound.js'
        import { initControls, controlDrone } from './src/control.js'

        const dt = 1.0 / 100.0; // physics timestep

        window.THREE = THREE;

        async function main() {

            // load config
            const config = await loadConfig()
            console.assert(config.version == 1.0)
            console.assert(config.aircraft.type == "quadcopter")

            // renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            const canvas = renderer.domElement;
            document.body.appendChild(canvas);

            // resources
            const { rapier, droneModel, propWav, terrainModel, bgMap, envMap, musicWav } = await loadResources(config, canvas)
            document.getElementById('battery').style.display = 'none'

            // capture mouse
            canvas.addEventListener("click", e => {
                if (e.button !== 0) return;

                if (document.pointerLockElement === null) {
                    canvas.requestPointerLock();
                } else {
                    document.exitPointerLock();
                }
            });

            // stats
            const { engineStats, graphicsStats } = createStats()

            // scene
            const scene = new THREE.Scene();
            window.scene = scene
            scene.background = new THREE.Color(0x87ceeb);
            if (debug) { scene.add(new THREE.AxesHelper(1)); }
            THREE.Object3D.DEFAULT_UP = new THREE.Vector3(
                -config.map.gravity[0],
                -config.map.gravity[1],
                -config.map.gravity[2]
            )
            THREE.Object3D.DEFAULT_UP.normalize()

            // lighting
            envMap.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = envMap;
            setFromRPYdeg(scene.environmentRotation, config.background.environmentMap.rollPitchYaw);
            bgMap.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = bgMap;
            setFromRPYdeg(scene.backgroundRotation, config.background.backgroundMap.rollPitchYaw);

            // rapier world
            const world = new RAPIER.World({ x: config.map.gravity[0], y: config.map.gravity[1], z: config.map.gravity[2] });
            world.timestep = dt * config.map.timeScale
            // const groundBody = world.createRigidBody(new RAPIER.RigidBodyDesc(RAPIER.RigidBodyType.Fixed).setTranslation(0, -1, 0));
            // world.createCollider(RAPIER.ColliderDesc.cuboid(50, 0.1, 50), groundBody);

            // drone
            const { droneBody, droneNode, droneSize, droneInertia, droneMixer } = createDrone(droneModel, config, scene, world)

            // camera
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera)

            // orbit controls do not work with a parent object, so we need to create a global dummy camera and copy its pose to the drone camera
            const camDummy = new THREE.PerspectiveCamera();
            scene.add(camDummy);
            camDummy.position.set(-1, 0, 0.4)
            camDummy.lookAt(0, 0, 0)
            const orbit = new OrbitControls(camDummy, renderer.domElement);
            orbit.update()
            orbit.screenSpacePanning = true;
            orbit.minDistance = 0.3;
            orbit.maxDistance = 3;
            orbit.mouseButtons = {
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.ROTATE
            }
            // target pose for camera which it will follow with some PT1 smoothing
            const camTarget = new THREE.Object3D()
            droneNode.add(camTarget)

            // debug
            const debugGeometry = initDebugRender()

            // trrain
            const terrainObject = createTerrain(terrainModel, config, scene, world)

            // sound
            const soundData = initSound(config, camera, droneNode, propWav, musicWav)

            // controls and physics
            const controlData = initControls(config, dt)

            const raycaster = new THREE.Raycaster();

            function updateCamera() {
                const fraction = 0.5
                let viewDir = camDummy.position.clone()
                droneNode.localToWorld(viewDir)
                viewDir.sub(droneNode.position)
                let far = viewDir.length()
                viewDir.normalize()
                raycaster.set(droneNode.position, viewDir)
                raycaster.far = far / fraction
                const intersects = raycaster.intersectObject(terrainObject, true)
                if (intersects.length > 0) {
                    const intersect = intersects[0]
                    camTarget.position.copy(intersect.point)
                    droneNode.worldToLocal(camTarget.position)
                    camTarget.position.multiplyScalar(fraction)
                }
                else {
                    camTarget.position.copy(camDummy.position);
                }
                camTarget.quaternion.copy(camDummy.quaternion);

                camera.position.lerp(camTarget.getWorldPosition(new THREE.Vector3()), 0.45)
                camera.quaternion.slerp(camTarget.getWorldQuaternion(new THREE.Quaternion()), 0.3)
            }

            // run engine
            world.step()
            let tNextStep = performance.now()
            function stepPhysics() {

                controlDrone(controlData, droneBody, droneInertia, soundData, config, dt)

                world.step()

                // update drone mesh
                const pos = droneBody.translation();
                const rot = droneBody.rotation();
                droneNode.position.set(pos.x, pos.y, pos.z);
                droneNode.quaternion.set(rot.x, rot.y, rot.z, rot.w);

                updateCamera();
                engineStats.update()
                const tNow = performance.now()
                tNextStep = tNextStep + dt * 1000
                tNextStep = Math.max(tNextStep, tNow - 100) // if we lag by more than 0.1s, we slow down
                setTimeout(stepPhysics, Math.max(0, tNextStep - tNow))
            }
            setTimeout(stepPhysics, dt * 1000)

            // run graphics
            function animate() {
                requestAnimationFrame(animate);
                if (debug) { updateDebugRender(world, debugGeometry) }
                droneMixer.setTime(Math.random() * 1000)
                renderer.render(scene, camera);
                graphicsStats.update()
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        main()

    </script>
</body>

</html>
