<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="media/favicon.ico">
    <title>PropWash</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.182.0/examples/jsm/"
      }
    }
    </script>
</head>

<body style="margin:0; overflow:hidden; background-color: #123456;">

    <div id="battery" style="
        height:33.333vh;
        width:calc(33.333vh * 0.3);
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        border:4px solid white;
        border-radius:20px;
        box-sizing:border-box;
        padding:10px;
        display:flex;
        flex-direction:column;
        justify-content:flex-end;
        pointer-events: none;
    ">
        <div id="progress" style="
            height:0%;
            width:100%;
            background:lime;
            border-radius:4px;
            position:relative;
            overflow:hidden;
        "></div>
        <span id="clickLabel" style="
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%) rotate(-90deg);
            white-space:nowrap;
            font-size:5vh;
            font-family:monospace;
            font-weight:bold;
            color:#123456;
        ">Click!</span>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
